<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b141a" />
    <title>Luisa Chan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="intro-screen" id="introScreen" aria-labelledby="introTitle">
      <div class="intro-orbit intro-orbit-one" aria-hidden="true"></div>
      <div class="intro-orbit intro-orbit-two" aria-hidden="true"></div>
      <div class="intro-noise" aria-hidden="true"></div>
      <div class="intro-content">
        <div class="intro-avatar-wrap" aria-hidden="true">
          <div class="intro-avatar-ring"></div>
          <div class="intro-avatar">L<span>·</span></div>
          <i class="intro-signal signal-one"></i><i class="intro-signal signal-two"></i><i class="intro-signal signal-three"></i>
        </div>
        <p class="intro-eyebrow">TU ESPACIO DE CONVERSACIÓN</p>
        <h1 id="introTitle">Hola, soy <em>Luisa Chan</em></h1>
        <p class="intro-copy">Empeze como un chiste en el Sena y ahora soy la competencia de una mas, empieza a chatear conmigo ya.</p>
        <button class="intro-start" id="introStart" type="button">
          <span>Comenzar a hablar</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </button>
        <div class="intro-features" aria-label="Funciones disponibles">
          <span><b>✦</b> Conversación personal</span>
          <span><b>◉</b> Mensajes de voz</span>
          <span><b>♡</b> Tu espacio privado</span>
        </div>
      </div>
      <p class="intro-footer">LUISA / CHAT LOCAL <span>•</span> V 2.0.0</p>
    </section>
    <main class="app-shell">
      <section class="chat-card" aria-label="Chat de Luisa Chan">
        <header class="chat-header">
          <div class="brand">
            <button class="avatar" id="avatarButton" type="button" title="Cambiar foto de perfil" aria-label="Cambiar foto de perfil">
              <img id="avatarImage" alt="" hidden />
              <span id="avatarFallback" aria-hidden="true">L<span>•</span></span>
            </button>
            <input class="sr-only" id="avatarInput" type="file" accept="image/*" />
            <div>
              <h1>Luisa Chan</h1>
              <p><span class="online-dot"></span> En línea</p>
            </div>
          </div>
          <div class="header-actions">
            <button class="mode-button" id="modeButton" type="button" aria-pressed="false" title="Activar modo Novia">
              <span aria-hidden="true">♡</span> Modo Novia
            </button>
            <button class="header-button" id="wallpaperButton" type="button" title="Personalizar fondo" aria-label="Personalizar fondo">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="m4 15 5-5 4 4 3-3 4 4"/><circle cx="9" cy="9" r="1.3"/></svg>
            </button>
            <button class="header-button" id="clearButton" type="button" title="Limpiar conversación" aria-label="Limpiar conversación">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14M10 10v6m4-6v6"/></svg>
            </button>
          </div>
        </header>

        <div class="wallpaper-panel" id="wallpaperPanel" hidden aria-label="Elegir fondo de chat">
          <div class="wallpaper-panel-head">
            <span>Fondo del chat</span>
            <button type="button" id="wallpaperClose" aria-label="Cerrar">✕</button>
          </div>
          <div class="wallpaper-grid">
            <button type="button" class="wallpaper-swatch" data-wallpaper="default" aria-label="Fondo predeterminado"><span class="swatch-preview swatch-default"></span>Puntos</button>
            <button type="button" class="wallpaper-swatch" data-wallpaper="plain" aria-label="Fondo liso"><span class="swatch-preview swatch-plain"></span>Liso</button>
            <button type="button" class="wallpaper-swatch" data-wallpaper="grid" aria-label="Fondo cuadrícula"><span class="swatch-preview swatch-grid"></span>Cuadrícula</button>
            <button type="button" class="wallpaper-swatch" data-wallpaper="lines" aria-label="Fondo líneas"><span class="swatch-preview swatch-lines"></span>Líneas</button>
            <button type="button" class="wallpaper-swatch" data-wallpaper="waves" aria-label="Fondo ondas"><span class="swatch-preview swatch-waves"></span>Ondas</button>
            <button type="button" class="wallpaper-swatch" data-wallpaper="hearts" aria-label="Fondo corazones"><span class="swatch-preview swatch-hearts"></span>Corazones</button>
          </div>
          <label class="wallpaper-upload" for="wallpaperInput">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            Subir imagen personalizada
          </label>
          <input class="sr-only" id="wallpaperInput" type="file" accept="image/*" />
        </div>

        <div class="conversation" id="conversation" aria-live="polite"></div>

        <div class="quick-actions" aria-label="Acciones rápidas">
          <button type="button" data-message="/ayuda">Ver comandos</button>
          <button type="button" data-message="¿Cuánto es 250 más 45?">Probar cálculo</button>
          <button type="button" data-message="/hora">Ver hora</button>
        </div>

        <form class="composer" id="chatForm" autocomplete="off" novalidate data-form-type="other">
          <input class="sr-only" id="imageInput" type="file" accept="image/*" />
          <input class="sr-only" id="audioInput" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.webm" />
          <button class="composer-icon" id="attachButton" type="button" title="Enviar imagen" aria-label="Enviar imagen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.4 11.6-8.8 8.8a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
          </button>
          <button class="composer-icon" id="audioAttachButton" type="button" title="Adjuntar audio" aria-label="Adjuntar audio">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
          </button>
          <button class="composer-icon" id="emojiButton" type="button" title="Elegir emoji" aria-label="Elegir emoji">☺</button>
          <label class="sr-only" for="messageInput">Escribe un mensaje</label>
          <input
            id="messageInput"
            type="text"
            name="message"
            placeholder="Escribe un mensaje"
            maxlength="500"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
            inputmode="text"
            enterkeyhint="send"
            aria-autocomplete="none"
            data-lpignore="true"
            data-1p-ignore
            data-bwignore
            data-form-type="other"
          />
          <button class="send-button" type="submit" aria-label="Enviar mensaje">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 3-7.4 18-3.9-7.1L3 10.4 21 3Zm-11.2 10.9L21 3"/></svg>
          </button>
          <button class="composer-icon record-button" id="recordButton" type="button" title="Dictar mensaje" aria-label="Dictar mensaje">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4m-3 0h6"/></svg>
          </button>
        </form>
        <div class="emoji-picker" id="emojiPicker" hidden aria-label="Selector de emojis">
          <button type="button">😀</button><button type="button">🥰</button><button type="button">😘</button><button type="button">❤️</button><button type="button">💕</button><button type="button">✨</button><button type="button">😂</button><button type="button">🤔</button><button type="button">👍</button><button type="button">🎉</button><button type="button">🌹</button><button type="button">🥹</button>
        </div>
      </section>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
